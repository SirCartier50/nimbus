name: Deploy

# Runs after CI succeeds on main (or manually via the Actions tab). Requires
# three repo secrets — see infra/DEPLOY.md:
#   DEPLOY_HOST      EC2 public DNS/IP
#   DEPLOY_USER      SSH user (ubuntu on Ubuntu AMIs)
#   DEPLOY_SSH_KEY   private key whose public half is on the instance
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; never cancel a deploy mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # stop_grace_period (60s) exceeds SHUTDOWN_DRAIN_SECONDS (55s), so
          # `up -d --build` recreating the backend drains in-flight turns.
          script: |
            set -euo pipefail
            cd /opt/nimbus
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
            # Fail the deploy if the API never comes back.
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)" >/dev/null 2>&1; then
                echo "backend ready"; exit 0
              fi
              sleep 5
            done
            echo "backend did not become ready" >&2
            docker compose -f docker-compose.prod.yml logs --tail 50 backend >&2
            exit 1
