# Production stack for the EC2 box (PROD-4). Standalone on purpose — the dev
# docker-compose.yml publishes raw ports and runs the frontend locally; here
# Caddy is the ONLY thing listening on the host, terminating TLS and reverse-
# proxying to the backend, and the frontend lives on Vercel instead.
#
#   DOMAIN=api.example.com docker compose -f docker-compose.prod.yml up -d --build
#
# See infra/DEPLOY.md for the one-time EC2 setup.
name: nimbus

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # ACME certs — must persist across restarts or
      - caddy_config:/config  # Let's Encrypt rate limits will bite
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the API hostname, e.g. api.example.com}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # Release step: migrations run exactly once per deploy, here — the worker
    # (same image) deliberately does not, so two containers never race DDL.
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    # No host ports: only Caddy (same compose network) can reach it.
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: "redis://redis:6379/0"
      LOG_FORMAT: "json"
      BODYGUARD_IN_API: "false"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s

  # Single-replica Bodyguard patrol. Never scale this above 1.
  worker:
    build:
      context: ./backend
    command: ["python", "worker.py"]
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: "redis://redis:6379/0"
      LOG_FORMAT: "json"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Override the backend image's HTTP HEALTHCHECK — the worker serves no HTTP,
    # so that probe would fail forever. Its real liveness dependency is Redis
    # (the patrol loop and token buckets live there); ping it via redis-py.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
